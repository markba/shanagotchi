[project]
name = "shanagotchi-ha"
version = "0.1.0"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "home-assistant-frontend==20261028.6",
    "pytest-homeassistant==2026.11.2",
 "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# respx imports httpx as pytest loads it, before Home Assistant has aliased httpx
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
